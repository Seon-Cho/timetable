<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주간 시간표 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1C2430; --muted:#5E6878; --line:#D5DBE3; --line-strong:#9AA4B2;
  --accent:#2F5AA8; --accent-ink:#FFFFFF; --danger:#B3261E; --warn-bg:#FFF4DB; --warn-ink:#6B4A00;
  --c-class:#CDE5F4; --c-fixed:#D9EED3; --c-special:#EAD2EE; --c-free:#FBE0D2; --c-sleep:#E4E7EC; --c-study:#FCF3A1;
  --c-ink:#1C2430; --ok:#2E7D4F; --ok-ink:#FFFFFF; --accent-soft:#DCE6F7;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161C; --surface:#1A2029; --ink:#E6EAF0; --muted:#98A2B3; --line:#2C3440; --line-strong:#4A5566;
    --accent:#7FA6EC; --accent-ink:#0E1522; --danger:#F2867D; --warn-bg:#3A3018; --warn-ink:#F2D78C;
    --c-class:#1F3B52; --c-fixed:#213E2C; --c-special:#3E2848; --c-free:#4A2F24; --c-sleep:#262B33; --c-study:#4A4417;
    --c-ink:#E6EAF0; --ok:#6CC592; --ok-ink:#0E1A13; --accent-soft:#24324A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161C; --surface:#1A2029; --ink:#E6EAF0; --muted:#98A2B3; --line:#2C3440; --line-strong:#4A5566;
  --accent:#7FA6EC; --accent-ink:#0E1522; --danger:#F2867D; --warn-bg:#3A3018; --warn-ink:#F2D78C;
  --c-class:#1F3B52; --c-fixed:#213E2C; --c-special:#3E2848; --c-free:#4A2F24; --c-sleep:#262B33; --c-study:#4A4417;
  --c-ink:#E6EAF0; --ok:#6CC592; --ok-ink:#0E1A13; --accent-soft:#24324A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding:0 16px}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 120px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--c-ink)}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px}
.row.err{border-color:var(--danger)}
.row-main{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=time],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=text]{flex:1 1 140px}
input[type=time]{font-family:var(--mono);font-size:14px;width:118px}
input[type=number]{font-family:var(--mono);width:90px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;padding:0}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tilde{color:var(--muted)}
.add{align-self:flex-start}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.errmsg{color:var(--danger);font-size:13px;margin:0}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.actionbar .in{max-width:1080px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.actionbar .hint{color:var(--muted);font-size:13px}

/* result */
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:14px}
.stat{font-size:14px;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--mono);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.warns{margin:0 0 14px;padding:10px 14px 10px 30px;background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;font-size:13px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.tt{border-collapse:collapse;width:100%;min-width:720px;table-layout:fixed;font-size:13px}
.tt th,.tt td{border:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.tt thead th{background:var(--bg);font-weight:600;padding:6px 0;position:sticky;top:0;z-index:1}
.tt thead th.we{color:var(--muted)}
.tt th.time{width:64px;font-family:var(--mono);font-weight:400;font-size:12px;color:var(--ink);background:var(--bg);height:24px}
.tt th.time.half{color:var(--muted)}
.tt tr.hour td,.tt tr.hour th{border-top-color:var(--line-strong)}
.tt td{height:24px}
.blk{color:var(--c-ink);line-height:1.25;padding:2px 4px}
.blk .n{font-weight:600;display:block;overflow-wrap:anywhere}
.blk .t{font-family:var(--mono);font-size:11px;opacity:.75;display:block}
.cat-class{background:var(--c-class)} .cat-fixed{background:var(--c-fixed)} .cat-special{background:var(--c-special)}
.cat-free{background:var(--c-free)} .cat-sleep{background:var(--c-sleep)} .cat-study{background:var(--c-study)}
.blk.cat-sleep{color:var(--muted)}
.tt td.slot{cursor:pointer;position:relative}
.tt tr td.join-down{border-bottom-color:var(--c-study)}
.tt tr td.join-up{border-top-color:var(--c-study)}
.tt td.slot:hover,.tt td.slot:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tt td.slot:hover::after,.tt td.slot:focus-visible::after{content:"빼기";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--accent)}
.tt td.excl{cursor:pointer;position:relative}
.tt td.excl:hover,.tt td.excl:focus-visible{outline:2px dashed var(--line-strong);outline-offset:-3px}
.tt td.excl:hover::after,.tt td.excl:focus-visible::after{content:"되돌리기";font-size:11px;color:var(--muted)}
.tip{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.tip .sw{display:inline-block;vertical-align:-2px;margin-right:4px}
/* 순공: 드래그, O/X */
.tt td.slot{touch-action:none;user-select:none;-webkit-user-select:none;padding-left:26px}
.tt td.slot.dragging{opacity:.35}
.tt td.drop-ok{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.mk{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 11px/1 var(--mono);padding:0;cursor:pointer;display:grid;place-items:center;z-index:1}
.mk:hover{border-color:var(--ink)}
.mk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mk.mk-o{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.mk.mk-x{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.drag-ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:30;background:var(--c-study);color:var(--c-ink);border:2px solid var(--accent);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
/* 상단 순공 현황 */
.dash{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:22px;display:grid;gap:12px}
.dash-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.dash-label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.dash-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dnum{font-family:var(--mono);font-size:48px;font-weight:500;line-height:1;color:var(--ok)}
.dunit{font-size:18px;color:var(--muted)}
.dplan{font-family:var(--mono);font-size:26px;color:var(--ink)}
.dpct{font-family:var(--mono);font-size:32px;font-weight:500;color:var(--ink);line-height:1}
.bar{height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .o{background:var(--ok)} .bar .x{background:var(--danger);opacity:.75}
.dash-sub{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dash-sub b{color:var(--ink);font-weight:600}
@media (max-width:560px){ .dnum{font-size:38px} .dpct{font-size:26px} }
@media (max-width:560px){ h1{font-size:22px} input[type=time]{width:108px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <!-- 입력 화면 -->
  <section id="page-input">
    <header class="top">
      <div>
        <h1>주간 시간표 플래너</h1>
        <p class="lede">여섯 가지 일정을 입력하면 월–일, 30분 단위 주간 시간표를 만들어요. 순공 시간은 빈 시간에 자동 배치되고, 시간표에서 직접 옮기거나 O/X로 실제 공부 여부를 표시할 수 있어요.</p>
      </div>
    </header>
    <div class="notice" id="sample-notice" hidden>
      <span>예시 일정이 채워져 있어요. 내 일정으로 바꿔서 입력하세요.</span>
      <button class="btn ghost" id="btn-clear" type="button">모두 비우기</button>
    </div>
    <div class="sections" id="sections"></div>
  </section>

  <!-- 결과 화면 -->
  <section id="page-result" hidden>
    <div class="dash" id="dash" aria-live="polite"></div>
    <header class="top">
      <div>
        <h1>이번 주 시간표</h1>
        <p class="lede" id="result-sub"></p>
      </div>
      <button class="btn" id="btn-back" type="button">← 뒤로 (일정 수정)</button>
    </header>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <ul class="warns" id="warns" hidden></ul>
    <div class="tip"><span><i class="sw" style="background:var(--c-study)"></i>순공 칸은 끌어서 빈칸(식사 시간 포함)으로 옮기고, 누르면 30분씩 빠져요. 칸 왼쪽 네모를 누르면 O → X → 비움 순으로 공부 여부를 표시해요.</span><button class="btn ghost" id="btn-reset-ex" type="button" hidden>자동 배치로 되돌리기</button></div>
    <div class="tablebox"><table class="tt" id="tt"></table></div>
  </section>
</div>

<div class="actionbar" id="actionbar">
  <div class="in">
    <span class="hint" id="bar-hint">시간은 30분 단위로 맞춰져요.</span>
    <button class="btn primary" id="btn-build" type="button">시간표 만들기 →</button>
  </div>
</div>

<script>
(function(){
const DAYS=['월','화','수','목','금','토','일'];
const CATS={
  class:{label:'수업',color:'--c-class'},
  fixed:{label:'고정 일정',color:'--c-fixed'},
  special:{label:'이번 주 약속',color:'--c-special'},
  free:{label:'자유시간',color:'--c-free'},
  sleep:{label:'취침',color:'--c-sleep'},
  study:{label:'순공',color:'--c-study'}
};
const STORE='weekly-timetable-v1';

const SAMPLE={
  classes:[
    {name:'스마트시티',days:[0],start:'10:00',end:'13:00'},
    {name:'질적 연구',days:[0],start:'14:00',end:'17:00'},
    {name:'미래도시 워크샵',days:[3],start:'10:00',end:'13:00'}
  ],
  fixed:[
    {name:'테니스',days:[0,1,3,4],start:'07:00',end:'07:30'},
    {name:'등교',days:[0,3],start:'08:00',end:'09:00'},
    {name:'하교',days:[0,2,3],start:'20:00',end:'21:00'},
    {name:'필라테스',days:[1],start:'19:00',end:'20:00'},
    {name:'필라테스',days:[5],start:'10:00',end:'11:00'}
  ],
  special:[
    {name:'치과',days:[2],start:'15:00',end:'16:00'},
    {name:'저녁 약속',days:[4],start:'18:30',end:'21:00'}
  ],
  free:[
    {name:'자유시간',days:[5],start:'14:00',end:'18:00'},
    {name:'자유시간',days:[6],start:'13:00',end:'17:00'}
  ],
  sleep:{wdWake:'06:30',wdBed:'23:30',weWake:'08:00',weBed:'00:00'},
  goal:25,
  keepMeals:true
};
const EMPTY=()=>({classes:[],fixed:[],special:[],free:[],sleep:{wdWake:'07:00',wdBed:'23:30',weWake:'08:00',weBed:'00:00'},goal:20,keepMeals:true});

let state, isSample=false;
try{ const s=localStorage.getItem(STORE); if(s){ state=JSON.parse(s); } }catch(e){}
if(!state){ state=JSON.parse(JSON.stringify(SAMPLE)); isSample=true; }
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(state)); }catch(e){} }

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toMin=t=>{ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmt=m=>{ m=((m%1440)+1440)%1440; return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); };
const floor30=m=>Math.floor(m/30)*30, ceil30=m=>Math.ceil(m/30)*30;

/* ---------- 입력 화면 ---------- */
const LISTS=[
  {key:'classes',cat:'class',n:1,title:'수업',desc:'과목명과 요일, 수업 시작·종료 시간',ph:'과목명 (예: 도시계획론)',addLabel:'수업 추가'},
  {key:'fixed',cat:'fixed',n:2,title:'고정 일정',desc:'매주 반복되는 일정 (운동, 통학, 출퇴근 등)',ph:'일정 이름 (예: 운동)',addLabel:'고정 일정 추가'},
  {key:'special',cat:'special',n:3,title:'이번 주 특별 일정',desc:'이번 주에만 있는 약속 (병원, 식사 약속 등)',ph:'약속 이름 (예: 병원)',addLabel:'약속 추가'},
  {key:'free',cat:'free',n:4,title:'자유시간',desc:'쉬고 싶은 요일과 시간대. 순공이 배치되지 않아요.',ph:'이름 (기본: 자유시간)',addLabel:'자유시간 추가'}
];

function renderInput(){
  const box=$('sections'); box.innerHTML='';
  LISTS.forEach(L=>{
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="sec-head"><span class="num" style="background:var(${CATS[L.cat].color})">${L.n}</span><div><h2>${L.title}</h2><p>${L.desc}</p></div></div><div class="rows"></div><button class="btn add" type="button">+ ${L.addLabel}</button>`;
    const rows=sec.querySelector('.rows');
    state[L.key].forEach((it,i)=>rows.appendChild(rowEl(L,it,i)));
    sec.querySelector('.add').onclick=()=>{ state[L.key].push({name:'',days:[],start:'',end:''}); save(); renderInput(); const ins=box.querySelectorAll(`[data-list="${L.key}"] input[type=text]`); ins[ins.length-1]?.focus(); };
    box.appendChild(sec);
  });
  // 5. 기상/취침
  const s5=document.createElement('div'); s5.className='sec';
  s5.innerHTML=`<div class="sec-head"><span class="num" style="background:var(--c-sleep)">5</span><div><h2>기상·취침 시간</h2><p>주중(월–금)과 주말(토–일)을 따로 정해요. 자정을 넘기면 00:30처럼 입력하세요.</p></div></div>
  <div class="grid2">
    <label class="field">주중 기상<input type="time" step="1800" id="wdWake" value="${state.sleep.wdWake}"></label>
    <label class="field">주중 취침<input type="time" step="1800" id="wdBed" value="${state.sleep.wdBed}"></label>
    <label class="field">주말 기상<input type="time" step="1800" id="weWake" value="${state.sleep.weWake}"></label>
    <label class="field">주말 취침<input type="time" step="1800" id="weBed" value="${state.sleep.weBed}"></label>
  </div>`;
  box.appendChild(s5);
  ['wdWake','wdBed','weWake','weBed'].forEach(k=>{ $(k).oninput=e=>{ state.sleep[k]=e.target.value; save(); }; });
  // 6. 순공 목표
  const s6=document.createElement('div'); s6.className='sec';
  s6.innerHTML=`<div class="sec-head"><span class="num" style="background:var(--c-study)">6</span><div><h2>주간 순공 목표</h2><p>비어 있는 깨어 있는 시간에 자동 배치해요. 주중·낮(9–18시)을 먼저 채우고, 요일마다 고르게 나눠요.</p></div></div>
  <label class="field">한 주 목표 (시간)<input type="number" id="goal" min="0" max="120" step="0.5" value="${state.goal}"></label>
  <label class="check"><input type="checkbox" id="keepMeals" ${state.keepMeals?'checked':''}> 식사 시간(12:00–13:00, 18:00–19:00)은 비워두기</label>`;
  box.appendChild(s6);
  $('goal').oninput=e=>{ state.goal=parseFloat(e.target.value)||0; save(); };
  $('keepMeals').onchange=e=>{ state.keepMeals=e.target.checked; save(); };
  $('sample-notice').hidden=!isSample;
}

function rowEl(L,it,i){
  const r=document.createElement('div'); r.className='row'; r.dataset.list=L.key; r.dataset.i=i;
  const id=`${L.key}-${i}`;
  r.innerHTML=`<div class="row-main">
    <input type="text" id="${id}-name" placeholder="${L.ph}" value="${esc(it.name||'')}" aria-label="이름">
    <div class="chips" role="group" aria-label="요일">${DAYS.map((d,di)=>`<button type="button" class="chip" id="${id}-d${di}" aria-pressed="${it.days.includes(di)}">${d}</button>`).join('')}</div>
    <input type="time" step="1800" id="${id}-start" value="${it.start||''}" aria-label="시작 시간">
    <span class="tilde">~</span>
    <input type="time" step="1800" id="${id}-end" value="${it.end||''}" aria-label="종료 시간">
  </div>
  <button type="button" class="btn ghost" aria-label="삭제" title="삭제">✕</button>`;
  r.querySelector(`#${id}-name`).oninput=e=>{ it.name=e.target.value; save(); };
  r.querySelector(`#${id}-start`).oninput=e=>{ it.start=e.target.value; save(); };
  r.querySelector(`#${id}-end`).oninput=e=>{ it.end=e.target.value; save(); };
  r.querySelectorAll('.chip').forEach((c,di)=>c.onclick=()=>{
    const k=it.days.indexOf(di); if(k>=0) it.days.splice(k,1); else it.days.push(di);
    it.days.sort(); c.setAttribute('aria-pressed',it.days.includes(di)); save();
  });
  r.querySelector('.btn.ghost').onclick=()=>{ state[L.key].splice(i,1); save(); renderInput(); };
  return r;
}

$('btn-clear').onclick=()=>{ state=EMPTY(); isSample=false; save(); renderInput(); };

function validate(){
  let ok=true;
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('err'));
  document.querySelectorAll('.errmsg').forEach(e=>e.remove());
  LISTS.forEach(L=>{
    state[L.key].forEach((it,i)=>{
      const blank=!it.name&&!it.days.length&&!it.start&&!it.end;
      if(blank) return;
      let msg='';
      const needName=L.key!=='free';
      if(needName&&!it.name.trim()) msg='이름을 입력하세요.';
      else if(!it.days.length) msg='요일을 하나 이상 고르세요.';
      else if(!it.start||!it.end) msg='시작·종료 시간을 입력하세요.';
      else if(toMin(it.end)<=toMin(it.start)) msg='종료 시간이 시작 시간보다 늦어야 해요.';
      if(msg){ ok=false; const r=document.querySelector(`.row[data-list="${L.key}"][data-i="${i}"]`); if(r){ r.classList.add('err'); const p=document.createElement('p'); p.className='errmsg'; p.textContent=msg; r.querySelector('.row-main').appendChild(p);} }
    });
  });
  const s=state.sleep;
  if(!s.wdWake||!s.wdBed||!s.weWake||!s.weBed){ ok=false; }
  return ok;
}

/* ---------- 시간표 계산 ---------- */
function build(){
  const warns=[];
  const s=state.sleep;
  const wake=[],bed=[];
  for(let d=0;d<7;d++){
    const we=d>=5;
    let w=floor30(toMin(we?s.weWake:s.wdWake)), b=ceil30(toMin(we?s.weBed:s.wdBed));
    if(b<=w) b+=1440;
    wake.push(w); bed.push(b);
  }
  const events=[];
  const PRI={special:0,class:1,fixed:2,free:3};
  const src=[['special','special'],['classes','class'],['fixed','fixed'],['free','free']];
  src.forEach(([key,cat])=>state[key].forEach(it=>{
    if(!it.days.length||!it.start||!it.end) return;
    const a=floor30(toMin(it.start)), b=ceil30(toMin(it.end));
    if(b<=a) return;
    const name=(it.name||'').trim()||(cat==='free'?'자유시간':CATS[cat].label);
    it.days.forEach(d=>events.push({cat,name,day:d,a,b,pri:PRI[cat]}));
  }));
  let gStart=Math.min(...wake), gEnd=Math.max(...bed);
  events.forEach(e=>{ gStart=Math.min(gStart,e.a); gEnd=Math.max(gEnd,e.b); });
  gStart=Math.floor(gStart/60)*60; gEnd=Math.ceil(gEnd/60)*60;
  const N=(gEnd-gStart)/30;
  const grid=[...Array(7)].map(()=>Array(N).fill(null));
  // 취침
  for(let d=0;d<7;d++) for(let r=0;r<N;r++){ const m=gStart+r*30; if(m<wake[d]||m>=bed[d]) grid[d][r]={cat:'sleep',name:'취침',pri:9}; }
  // 일정 (우선순위 높은 것부터)
  events.sort((x,y)=>x.pri-y.pri).forEach(e=>{
    for(let m=e.a;m<e.b;m+=30){
      const r=(m-gStart)/30, cur=grid[e.day][r];
      if(!cur||cur.cat==='sleep'){
        if(cur&&cur.cat==='sleep') addWarn(warns,`${DAYS[e.day]} ${e.name}: 취침 시간과 겹쳐요.`);
        grid[e.day][r]={cat:e.cat,name:e.name,pri:e.pri};
      } else if(!(cur.cat===e.cat&&cur.name===e.name)){
        addWarn(warns,`${DAYS[e.day]} ${fmt(m)} 부근: ‘${e.name}’이(가) ‘${cur.name}’와 겹쳐서 ‘${cur.name}’을(를) 표시했어요.`);
      }
    }
  });
  // 순공 자동 배치
  const goalSlots=Math.round((state.goal||0)*2);
  // 직접 옮겨 둔 순공 칸을 먼저 넣음 (식사 시간도 가능)
  let placed=0;
  (state.pinned||[]).forEach(k=>{
    const [d,m]=k.split('-').map(Number), r=(m-gStart)/30;
    if(!(r>=0&&r<N&&Number.isInteger(r))) return;
    if(!grid[d][r]){ grid[d][r]={cat:'study',name:'순공',pri:8,pinned:true}; placed++; }
    else addWarn(warns,`${DAYS[d]} ${fmt(m)}에 옮겨 둔 순공이 ‘${grid[d][r].name}’과 겹쳐서 빠졌어요.`);
  });
  const isMeal=m=>state.keepMeals&&((m>=720&&m<780)||(m>=1080&&m<1140));
  const ex=new Set(state.excluded||[]);
  const tiers=[[],[],[],[]];
  for(let d=0;d<7;d++){
    const q=[[],[],[],[]];
    for(let r=0;r<N;r++){
      const m=gStart+r*30;
      if(grid[d][r]||m<wake[d]||m>=bed[d]||isMeal(m)) continue;
      if(ex.has(d+'-'+m)){ grid[d][r]={cat:'excl'}; continue; }
      const day=m>=540&&m<1080;
      const t=(d<5?0:2)+(day?0:1);
      q[t].push(r);
    }
    q.forEach((list,t)=>tiers[t].push({d,list}));
  }
  for(const tier of tiers){
    let progress=true;
    while(placed<goalSlots&&progress){
      progress=false;
      for(const {d,list} of tier){
        if(placed>=goalSlots) break;
        if(list.length){ const r=list.shift(); grid[d][r]={cat:'study',name:'순공',pri:8}; placed++; progress=true; }
      }
    }
  }
  if(placed<goalSlots) addWarn(warns,`빈 시간이 부족해서 순공을 ${placed/2}시간만 배치했어요 (목표 ${state.goal}시간).`);
  return {grid,gStart,N,warns,placed};
}
function addWarn(arr,t){ if(!arr.includes(t)) arr.push(t); }

/* ---------- 결과 화면 ---------- */
function renderResult(res){
  const {grid,gStart,N,warns,placed}=res;
  // 합계
  const tot={class:0,fixed:0,special:0,free:0,study:0};
  grid.forEach(col=>col.forEach(c=>{ if(c&&tot[c.cat]!==undefined) tot[c.cat]+=0.5; }));
  $('result-sub').textContent=`${fmt(gStart)}부터 ${fmt(gStart+N*30)}까지, 30분 단위로 보여줘요.`;
  $('summary').innerHTML=
    `<span class="stat">수업 <b>${tot.class}</b>시간</span>`+
    `<span class="stat">고정 <b>${tot.fixed}</b>시간</span>`+
    `<span class="stat">약속 <b>${tot.special}</b>시간</span>`+
    `<span class="stat">자유 <b>${tot.free}</b>시간</span>`;
  $('legend').innerHTML=Object.entries(CATS).map(([k,v])=>`<span><i class="sw" style="background:var(${v.color})"></i>${v.label}</span>`).join('');
  const w=$('warns'); w.hidden=!warns.length; w.innerHTML=warns.map(t=>`<li>${esc(t)}</li>`).join('');
  const changed=(state.excluded||[]).length+(state.pinned||[]).length;
  $('btn-reset-ex').hidden=!changed;

  // 상단 현황: 계획 대비 실제 순공 (O 표시한 칸)
  const marks=state.marks||{};
  let o=0,x=0;
  for(let d=0;d<7;d++) for(let r=0;r<N;r++){
    const c=grid[d][r]; if(!c||c.cat!=='study') continue;
    const v=marks[d+'-'+(gStart+r*30)]; if(v==='o') o++; else if(v==='x') x++;
  }
  const plan=placed/2, real=o/2, rest=placed-o-x;
  const pct=plan?Math.round(real/plan*100):0;
  const wo=placed?o/placed*100:0, wx=placed?x/placed*100:0;
  $('dash').innerHTML=`
    <div class="dash-top">
      <div>
        <div class="dash-label">실제 순공 / 계획</div>
        <div class="dash-big"><span class="dnum">${real}</span><span class="dunit">시간</span><span class="dplan">/ ${plan}</span><span class="dunit">시간</span></div>
      </div>
      <div style="text-align:right">
        <div class="dash-label">달성률</div>
        <div class="dpct">${pct}%</div>
      </div>
    </div>
    <div class="bar" role="img" aria-label="계획 ${plan}시간 중 실제 ${real}시간"><i class="o" style="width:${wo}%"></i><i class="x" style="width:${wx}%"></i></div>
    <div class="dash-sub"><span>O 공부함 <b>${o/2}시간</b></span><span>X 못 함 <b>${x/2}시간</b></span><span>아직 표시 안 함 <b>${rest/2}시간</b></span><span>주간 목표 <b>${state.goal}시간</b></span></div>`;

  // 블록(연속 칸 합치기). 순공은 30분씩 따로 다뤄야 하므로 칸을 나눠 두고 테두리만 이어 보이게 함
  const span=[...Array(7)].map(()=>Array(N).fill(0)); // >0: 블록 시작 rowspan, -1: 가려짐, 0: 빈칸
  const run=[...Array(7)].map(()=>Array(N).fill(null));
  for(let d=0;d<7;d++){
    let r=0;
    while(r<N){
      const c=grid[d][r];
      if(!c||c.cat==='excl'){ r++; continue; }
      let k=r+1; while(k<N&&grid[d][k]&&grid[d][k].cat===c.cat&&grid[d][k].name===c.name) k++;
      if(c.cat==='study'){
        for(let j=r;j<k;j++){ span[d][j]=1; run[d][j]={i:j-r,len:k-r,a:gStart+r*30,b:gStart+k*30}; }
      } else {
        span[d][r]=k-r; for(let j=r+1;j<k;j++) span[d][j]=-1;
      }
      r=k;
    }
  }
  let h='<colgroup><col style="width:64px">'+DAYS.map(()=>'<col>').join('')+'</colgroup>';
  h+='<thead><tr><th></th>'+DAYS.map((d,i)=>`<th class="${i>=5?'we':''}">${d}</th>`).join('')+'</tr></thead><tbody>';
  for(let r=0;r<N;r++){
    const m=gStart+r*30, hour=m%60===0;
    h+=`<tr class="${hour?'hour':''}"><th class="time ${hour?'':'half'}">${fmt(m)}</th>`;
    for(let d=0;d<7;d++){
      const sp=span[d][r], c=grid[d][r];
      if(sp===-1) continue;
      if(c&&c.cat==='excl'){ h+=`<td class="excl" data-d="${d}" data-m="${m}" tabindex="0" role="button" title="${DAYS[d]} ${fmt(m)} 순공 되돌리기"></td>`; continue; }
      if(sp===0){ h+=`<td class="empty" data-d="${d}" data-m="${m}"></td>`; continue; }
      if(c.cat==='study'){
        const R=run[d][r], key=d+'-'+m, v=marks[key];
        const cls=['blk','cat-study','slot'];
        if(R.i>0) cls.push('join-up');
        if(R.i<R.len-1) cls.push('join-down');
        let inner='';
        if(R.i===0) inner=`<span class="n">순공</span>`;
        else if(R.i===1) inner=`<span class="t">${fmt(R.a)}–${fmt(R.b)}</span>`;
        const mk=`<button type="button" class="mk${v?' mk-'+v:''}" data-k="${key}" aria-label="${DAYS[d]} ${fmt(m)} 공부 여부: ${v==='o'?'O':v==='x'?'X':'표시 안 함'}">${v==='o'?'O':v==='x'?'X':''}</button>`;
        h+=`<td class="${cls.join(' ')}" data-d="${d}" data-m="${m}" tabindex="0" role="button" title="${DAYS[d]} ${fmt(m)}–${fmt(m+30)} 순공 · 끌어서 옮기기, 눌러서 빼기">${mk}${inner}</td>`;
        continue;
      }
      const a=m, b=m+sp*30;
      const t=sp>=2?`<span class="t">${fmt(a)}–${fmt(b)}</span>`:'';
      h+=`<td rowspan="${sp}" class="blk cat-${c.cat}" title="${esc(c.name)} ${fmt(a)}–${fmt(b)}"><span class="n">${esc(c.name)}</span>${t}</td>`;
    }
    h+='</tr>';
  }
  $('tt').innerHTML=h+'</tbody>';
}

/* 화면 위치를 유지한 채 다시 그리기 */
function rerender(focusSel){
  const sx=window.scrollX, sy=window.scrollY, box=document.querySelector('.tablebox'), bx=box.scrollLeft;
  renderResult(build());
  window.scrollTo(sx,sy); box.scrollLeft=bx;
  if(focusSel){ const el=document.querySelector(focusSel); el&&el.focus({preventScroll:true}); }
}
const arr=k=>(state[k]=state[k]||[]);
const del=(k,v)=>{ const a=arr(k), i=a.indexOf(v); if(i>=0) a.splice(i,1); };
const add=(k,v)=>{ const a=arr(k); if(!a.includes(v)) a.push(v); };

/* 순공 칸 빼기 / 되돌리기 */
function toggleSlot(td){
  const key=td.dataset.d+'-'+td.dataset.m;
  if(td.classList.contains('slot')){ del('pinned',key); add('excluded',key); if(state.marks) delete state.marks[key]; }
  else if(td.classList.contains('excl')) del('excluded',key);
  else return;
  save();
  rerender(`#tt td[data-d="${td.dataset.d}"][data-m="${td.dataset.m}"]`);
}
/* O → X → 비움 */
function cycleMark(btn){
  const k=btn.dataset.k; state.marks=state.marks||{};
  const v=state.marks[k]; const nv=v==='o'?'x':v==='x'?'':'o';
  if(nv) state.marks[k]=nv; else delete state.marks[k];
  save(); rerender(`.mk[data-k="${k}"]`);
}
/* 순공 칸 옮기기 */
function moveSlot(src,dst){
  const ks=src.dataset.d+'-'+src.dataset.m, kd=dst.dataset.d+'-'+dst.dataset.m;
  if(arr('pinned').includes(ks)) del('pinned',ks); else add('excluded',ks);
  del('excluded',kd); add('pinned',kd);
  state.marks=state.marks||{};
  if(state.marks[ks]){ state.marks[kd]=state.marks[ks]; delete state.marks[ks]; }
  save(); rerender();
}

let drag=null, suppressClick=false;
$('tt').addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('.mk')) return;
  const td=e.target.closest('td.slot'); if(!td) return;
  drag={src:td,x:e.clientX,y:e.clientY,on:false,ghost:null,target:null,id:e.pointerId};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
    drag.on=true; drag.src.classList.add('dragging');
    const g=document.createElement('div'); g.className='drag-ghost';
    g.textContent=`순공 30분 · ${DAYS[+drag.src.dataset.d]} ${fmt(+drag.src.dataset.m)}`;
    document.body.appendChild(g); drag.ghost=g;
  }
  e.preventDefault();
  drag.ghost.style.transform=`translate(${e.clientX+12}px,${e.clientY-34}px)`;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const t=el&&el.closest?el.closest('#tt td.empty,#tt td.excl'):null;
  if(t!==drag.target){ drag.target&&drag.target.classList.remove('drop-ok'); drag.target=t; t&&t.classList.add('drop-ok'); }
  if(t) drag.ghost.textContent=`→ ${DAYS[+t.dataset.d]} ${fmt(+t.dataset.m)}`;
  else drag.ghost.textContent=`순공 30분 · ${DAYS[+drag.src.dataset.d]} ${fmt(+drag.src.dataset.m)}`;
  // 화면 가장자리에서 자동 스크롤
  if(e.clientY<60) window.scrollBy(0,-14); else if(e.clientY>window.innerHeight-60) window.scrollBy(0,14);
},{passive:false});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.id)) return;
  const d=drag; drag=null;
  if(!d.on) return;
  suppressClick=true; setTimeout(()=>{suppressClick=false;},0);
  d.ghost&&d.ghost.remove(); d.src.classList.remove('dragging'); d.target&&d.target.classList.remove('drop-ok');
  if(!cancel&&d.target) moveSlot(d.src,d.target);
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

$('tt').addEventListener('click',e=>{
  if(suppressClick) return;
  const b=e.target.closest('.mk'); if(b){ e.stopPropagation(); cycleMark(b); return; }
  const td=e.target.closest('td.slot,td.excl'); if(td) toggleSlot(td);
});
$('tt').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  if(e.target.closest('.mk')) return; // 버튼 기본 동작 사용
  const td=e.target.closest('td.slot,td.excl'); if(td){ e.preventDefault(); toggleSlot(td); }
});
$('btn-reset-ex').onclick=()=>{ state.excluded=[]; state.pinned=[]; save(); rerender(); };

/* ---------- 화면 전환 ---------- */
function show(page){
  $('page-input').hidden=page!=='input';
  $('page-result').hidden=page!=='result';
  $('actionbar').hidden=page!=='input';
  window.scrollTo(0,0);
}
$('btn-build').onclick=()=>{
  if(!validate()){ $('bar-hint').textContent='빨간 표시된 항목을 확인해 주세요.'; const e=document.querySelector('.row.err'); e&&e.scrollIntoView({block:'center'}); return; }
  $('bar-hint').textContent='시간은 30분 단위로 맞춰져요.';
  renderResult(build()); show('result');
};
$('btn-back').onclick=()=>{ renderInput(); show('input'); };

renderInput();
show('input');
})();
</script>
